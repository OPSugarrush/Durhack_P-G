[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "needstate-engine"
version = "0.1.0"
description = "Explainable receipt patterns and consumer routines with uncertainty"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "numpy>=2,<3", "scipy>=1.14,<2", "PyYAML>=6,<7", "openpyxl>=3.1,<4", "networkx>=3.3,<4", "rapidfuzz>=3.9,<4", "streamlit>=1.40,<2", "plotly>=5.24,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
web = ["starlette>=0.47,<2", "uvicorn>=0.35,<1", "python-multipart>=0.0.20,<1"]

[project.scripts]
needstate = "needstate.__main__:main"
needstate-web = "needstate.workspace.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
